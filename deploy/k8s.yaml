apiVersion: v1
kind: Namespace
metadata:
  name: sunmao-samples
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunmao-test-go
  namespace: sunmao-samples
  labels:
    app: sunmao-test-go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sunmao-test-go
  template:
    metadata:
      labels:
        app: sunmao-test-go
    spec:
      containers:
        - name: app
          image: swr.cn-east-2.myhuaweicloud.com/dx_x2era/sunmao-test-go:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sunmao-test-go
  namespace: sunmao-samples
spec:
  selector:
    app: sunmao-test-go
  ports:
    - name: http
      port: 8080
      targetPort: 8080
